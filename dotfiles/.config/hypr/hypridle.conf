general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # turn screen on after waking (0.57 Lua dispatch syntax)
}

listener {
    timeout = 150                                # 2.5 min
    on-timeout = brightnessctl -s set 10         # store brightness and dim to 10
    on-resume = brightnessctl -r                 # restore brightness
}

listener {
    timeout = 300                                # 5 min
    on-timeout = loginctl lock-session           # lock the screen
}

listener {
    timeout = 330                                # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'  # turn off the screen
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'    # turn on the screen
}

listener {
    timeout = 600                                # 10 min
    on-timeout = systemctl suspend               # put laptop to sleep
}
