general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn screen on after waking
}

listener {
    timeout = 150                                # 2.5 min
    on-timeout = brightnessctl -s set 10         # store brightness and dim to 10
    on-resume = brightnessctl -r                 # restore brightness
}

listener {
    timeout = 300                                # 5 min
    on-timeout = loginctl lock-session           # lock the screen
}

listener {
    timeout = 330                                # 5.5 min
    on-timeout = hyprctl dispatch dpms off       # turn off the screen
    on-resume = hyprctl dispatch dpms on         # turn on the screen
}

listener {
    timeout = 600                               # 30 min
    on-timeout = systemctl suspend               # put laptop to sleep
}
